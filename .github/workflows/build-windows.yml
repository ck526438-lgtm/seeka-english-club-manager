name: Build Windows EXE
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/upload-artifact@v4
        with:
          name: Seeka-English-Club-Windows
          path: dist/*.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Seeka English Club Manager v1.1.0
          body: "Nouveau : bouton « Enregistrer en PDF » (compte-rendu des séances affichées). Installateur (Setup) et version portable."
          make_latest: true
          files: "dist/*.exe"
